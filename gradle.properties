# Gradle JVM args (Loom can be memory-hungry during decompilation)
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with Gradle's configuration cache.
# See https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric versions — verify at https://fabricmc.net/develop
# Built against 26.2; the jar declares a compatibility range down to 26.1 in
# fabric.mod.json (depends.minecraft), so one artifact loads on both.
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.16.1
fabric_api_version=0.153.0+26.2

# Kotlin — intentionally pinned to 2.3.21 (not the 2.4.0 that FLK 1.13.12 bundles
# for 26.2). Compiling against the older stdlib runs fine on both 26.1's FLK
# (Kotlin 2.3.21) and 26.2's FLK (2.4.0, backward-compatible), keeping the single
# jar loadable on 26.1. Bump only if you drop 26.1 support.
kotlin_version=2.3.21
fabric_kotlin_version=1.13.11+kotlin.2.3.21

# Mod identity
mod_version=1.2.1
maven_group=dev.skrasek
archives_base_name=dbhvault

# Permissions
fabric_permissions_version=0.3.1

# Compression
zstd_jni_version=1.5.6-3

# Config
tomlkt_version=0.3.7

# Coroutines + tests
kotlinx_coroutines_version=1.10.2
junit_version=5.10.2
mockk_version=1.13.10

# Observability
# sentry_version is the SDK version. The sentry_gradle_plugin will auto-install
# this same version (it would otherwise warn and override); keep them aligned.
sentry_version=8.40.0
sentry_gradle_plugin_version=6.6.0
